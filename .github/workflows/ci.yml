name: CI

on: [push, pull_request]

jobs:
  rubocop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - run: bundle exec rubocop

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.2', '3.3', '3.4']
        tarantool:
          - { service: tarantool-2.11, port: 3301 }
          - { service: tarantool-3, port: 3302 }
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: docker compose -f tarantool-client/docker-compose.yml up -d --wait ${{ matrix.tarantool.service }}
      - run: bundle exec rspec
        working-directory: tarantool-client
        env:
          INTEGRATION: '1'
          TARANTOOL_URI: tcp://app:secret@localhost:${{ matrix.tarantool.port }}
