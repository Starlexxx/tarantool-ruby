name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:

jobs:
  rubocop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - run: bundle exec rubocop

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.2', '3.3', '3.4']
        tarantool:
          - { service: tarantool-2.11, port: 3301 }
          - { service: tarantool-3, port: 3302 }
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: docker compose -f tarantool-client/docker-compose.yml up -d --wait ${{ matrix.tarantool.service }}
      - run: bundle exec rspec
        working-directory: tarantool-client
        env:
          INTEGRATION: '1'
          TARANTOOL_URI: tcp://app:secret@localhost:${{ matrix.tarantool.port }}

  failover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - run: >-
          docker compose -p tarantool-failover -f tarantool-client/docker-compose.yml --profile failover
          up -d --wait failover-a failover-b
      - run: bundle exec rspec --tag failover
        working-directory: tarantool-client
        env:
          TARANTOOL_FAILOVER_URIS: tcp://app:secret@localhost:3311,tcp://app:secret@localhost:3312
          TARANTOOL_FAILOVER_CONTAINERS: tarantool-failover-failover-a-1,tarantool-failover-failover-b-1

  crud:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.2', '3.3', '3.4']
        tarantool:
          - { service: tarantool-2.11, port: 3311 }
          - { service: tarantool-3, port: 3312 }
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: docker compose -f tarantool-crud/docker-compose.yml up -d --wait --build ${{ matrix.tarantool.service }}
      - run: bundle exec rspec
        working-directory: tarantool-crud
        env:
          INTEGRATION: '1'
          TARANTOOL_CRUD_URI: tcp://app:secret@localhost:${{ matrix.tarantool.port }}

  model:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.2', '3.3', '3.4']
        tarantool:
          - { service: box-2.11, port: 3321 }
          - { service: box-3, port: 3322 }
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: docker compose -f tarantool-model/docker-compose.yml up -d --wait ${{ matrix.tarantool.service }}
      - run: bundle exec rspec
        working-directory: tarantool-model
        env:
          INTEGRATION: '1'
          TARANTOOL_MODEL_URI: tcp://app:secret@localhost:${{ matrix.tarantool.port }}

  model-crud:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.2', '3.3', '3.4']
        tarantool:
          - { service: crud-2.11, port: 3331 }
          - { service: crud-3, port: 3332 }
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: docker compose -f tarantool-model/docker-compose.yml up -d --wait --build ${{ matrix.tarantool.service }}
      - run: bundle exec rspec --tag crud
        working-directory: tarantool-model
        env:
          TARANTOOL_MODEL_CRUD_URI: tcp://app:secret@localhost:${{ matrix.tarantool.port }}

  schema:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.2', '3.3', '3.4']
        tarantool:
          - { service: tarantool-2.11, port: 3301 }
          - { service: tarantool-3, port: 3302 }
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: docker compose -f tarantool-client/docker-compose.yml up -d --wait ${{ matrix.tarantool.service }}
      - run: bundle exec rspec
        working-directory: tarantool-schema
        env:
          INTEGRATION: '1'
          TARANTOOL_URI: tcp://app:secret@localhost:${{ matrix.tarantool.port }}

  rails:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.2', '3.3', '3.4']
        tarantool:
          - { service: tarantool-2.11, port: 3301 }
          - { service: tarantool-3, port: 3302 }
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: docker compose -f tarantool-client/docker-compose.yml up -d --wait ${{ matrix.tarantool.service }}
      - run: bundle exec rspec
        working-directory: tarantool-rails
        env:
          INTEGRATION: '1'
          TARANTOOL_URI: tcp://app:secret@localhost:${{ matrix.tarantool.port }}
