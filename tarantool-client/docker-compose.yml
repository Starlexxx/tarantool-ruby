x-tarantool: &tarantool
  entrypoint: ['tarantool']
  command: ['/opt/tarantool/init.lua']
  volumes:
    - ./spec/integration/init.lua:/opt/tarantool/init.lua:ro
  healthcheck:
    test: ['CMD', 'tarantool', '-e', "os.exit(require('socket').tcp_connect('127.0.0.1', 3301) and 0 or 1)"]
    interval: 1s
    retries: 30

services:
  tarantool-2.11:
    <<: *tarantool
    image: tarantool/tarantool:2.11
    ports: ['3301:3301']

  tarantool-3:
    <<: *tarantool
    image: tarantool/tarantool:3
    ports: ['3302:3301']
