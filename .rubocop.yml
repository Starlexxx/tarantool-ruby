plugins:
  - rubocop-performance
  - rubocop-rspec

AllCops:
  NewCops: enable
  TargetRubyVersion: 3.2
  SuggestExtensions: false
  Exclude:
    - 'vendor/**/*'
    - 'tmp/**/*'

Metrics/ParameterLists:
  CountKeywordArgs: false

RSpec/ExampleLength:
  Max: 10

RSpec/MultipleExpectations:
  Max: 3

Naming/PredicateMethod:
  AllowedMethods:
    - call
    - ping

# Internal threads must survive, or be joined despite, whatever exception user code or a crash raised,
# and request events must report every exception before re-raising it.
Lint/RescueException:
  Exclude:
    - 'tarantool-client/lib/tarantool/client/thread_join.rb'
    - 'tarantool-client/lib/tarantool/client/callback_guard.rb'
    - 'tarantool-client/lib/tarantool/client/instrumentation.rb'

RSpec/SpecFilePathFormat:
  CustomTransform:
    OpenTelemetry: opentelemetry
