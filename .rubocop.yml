plugins:
  - rubocop-performance
  - rubocop-rspec

AllCops:
  NewCops: enable
  TargetRubyVersion: 3.2
  SuggestExtensions: false
  Exclude:
    - 'vendor/**/*'
    - 'tmp/**/*'

Metrics/ParameterLists:
  CountKeywordArgs: false

RSpec/ExampleLength:
  Max: 10

RSpec/MultipleExpectations:
  Max: 3

Naming/PredicateMethod:
  AllowedMethods:
    - call
    - ping

# Joining an internal thread must swallow whatever exception it died with.
Lint/RescueException:
  Exclude:
    - 'tarantool-client/lib/tarantool/client/thread_join.rb'
