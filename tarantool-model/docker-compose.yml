x-tarantool: &tarantool
  # TT_* variables baked into the 3.x image switch Tarantool to declarative config mode and break box.cfg scripts.
  entrypoint: ['env', '-u', 'TT_APP_NAME', '-u', 'TT_INSTANCE_NAME', 'tarantool']
  command: ['/opt/tarantool/box.lua']
  volumes:
    - ./spec/integration/box.lua:/opt/tarantool/box.lua:ro
  healthcheck:
    test:
      - CMD-SHELL
      - >-
        tarantool -e "os.exit(require('socket').tcp_connect('127.0.0.1', 3301) and 0 or 1)"
    interval: 1s
    retries: 30

x-crud: &crud
  entrypoint: ['env', '-u', 'TT_APP_NAME', '-u', 'TT_INSTANCE_NAME', 'tarantool']
  command: ['/opt/tarantool/crud_init.lua']
  volumes:
    - ./spec/integration/crud_init.lua:/opt/tarantool/crud_init.lua:ro
  healthcheck:
    test:
      - CMD-SHELL
      - >-
        tarantool -e "local c = require('net.box').connect('app:secret@127.0.0.1:3301')
        os.exit(pcall(c.call, c, 'crud.len', {'users'}) and 0 or 1)"
    interval: 1s
    retries: 60

services:
  box-2.11:
    <<: *tarantool
    image: tarantool/tarantool:2.11
    ports: ['3321:3301']

  box-3:
    <<: *tarantool
    image: tarantool/tarantool:3
    ports: ['3322:3301']

  crud-2.11:
    <<: *crud
    image: tarantool-crud:2.11
    build: { context: ../tarantool-crud/docker, args: { TARANTOOL_VERSION: '2.11' } }
    ports: ['3331:3301']

  crud-3:
    <<: *crud
    image: tarantool-crud:3
    build: { context: ../tarantool-crud/docker, args: { TARANTOOL_VERSION: '3' } }
    ports: ['3332:3301']
